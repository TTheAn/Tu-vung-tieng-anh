<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="Từ vựng tiếng anh">
<title>Từ vựng tiếng anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#1B2559;--mute:#4A5586;--bg:#E9EEF9;--line:#B7C3E6;--rule:#DCE5F7;--blue:#2F4BBF;--yel:#FFD84D;--yel2:#FFE98A;--pink:#F4A9A9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Noto Sans',system-ui,sans-serif;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
button{font-family:inherit;color:inherit;cursor:pointer}
.ipa,.mono{font-family:'Noto Sans',sans-serif}
#hdr{flex:none;min-height:34px}
#hdr h1{margin:0;font-size:15px;font-weight:600;color:var(--mute)}
.qh{font-size:13px;font-weight:800;margin-bottom:6px}
.segs{display:flex;gap:4px}
.seg{flex:1;height:7px;border-radius:4px;background:#C9D3EE}
.seg.d{background:var(--ink)}
.seg.c{background:var(--yel);border:2px solid var(--ink)}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px 4px;margin:0 -4px}
main.qm{overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:14px 10px 6px 4px}
.start{display:flex;flex-direction:column;min-height:100%}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:300px}
.tile{position:absolute;width:48px;height:48px;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;font-style:normal}
.tile.a{left:0;top:30px;background:var(--yel);transform:rotate(-12deg)}
.tile.b{right:2px;top:10px;background:#fff;transform:rotate(10deg)}
.tile.c{left:8px;bottom:20px;background:#FFC9C9;transform:rotate(8deg)}
.tile.d{right:6px;bottom:50px;background:#BDEBD7;transform:rotate(-8deg)}
.sheet{position:relative;border:3px solid var(--ink);border-radius:26px;background:repeating-linear-gradient(#fff 0 35px,var(--rule) 35px 36px);box-shadow:6px 6px 0 var(--ink);text-align:center}
.sheet::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--pink)}
.sheet.big{width:272px;padding:40px 24px 34px;box-shadow:8px 8px 0 var(--ink);transform:rotate(-2deg)}
.sheet.big h2{position:relative;margin:18px 0 0;font-size:30px;font-weight:800;line-height:1.2}
.sheet.big svg{position:relative}
.sheet.q{flex:none;border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px 12px;background:repeating-linear-gradient(#fff 0 27px,var(--rule) 27px 28px)}
.hole{position:absolute;top:-13px;width:20px;height:20px;border:3px solid var(--ink);border-radius:50%;background:var(--bg)}
.hole.l{left:60px}.hole.r{right:60px}
.sheet.q>*:not(.hole){position:relative}
.word{font-size:clamp(26px,8.5vw,34px);font-weight:800;line-height:1.1;word-break:break-word}
.pos{font-size:15px;font-weight:700;color:var(--blue);margin-top:2px}
.ipa{margin-top:4px;font-size:16px;color:var(--mute)}
.ipa span{font-size:11px;font-weight:600;border:1.5px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:5px}
.spk{display:flex;gap:10px;justify-content:center;margin-top:8px}
.sp{height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:18px;background:#fff;font-size:13px;font-weight:800}
.ask{flex:none;font-size:13px;font-weight:600;color:var(--mute);margin:2px 2px 0}
.opts{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 4px 4px 0}
.opt{flex:1;min-height:38px;max-height:62px;display:flex;align-items:center;gap:10px;width:100%;padding:0 12px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:600;line-height:1.2;text-align:left}
.opt .lt{width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.opt .ck{display:none;margin-left:auto;flex:none}
.opt.sel{border:3px solid var(--ink);padding:0 11px;background:var(--yel2);box-shadow:4px 4px 0 var(--ink);font-weight:800}
.opt.sel .lt{background:var(--ink);color:#fff}
.opt.sel .ck{display:block}
.cta{height:64px;width:100%;border:0;border-radius:20px;background:var(--ink);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.note{text-align:center;color:var(--mute);line-height:1.6;padding:18px 8px}
#foot{display:none;grid-template-columns:52px 1fr;gap:10px;padding-top:8px;flex:none}
#foot button{height:52px;border-radius:16px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
#back{border:2.5px solid var(--ink);background:#fff}
#next{border:0;background:var(--ink);color:#fff}
#foot button:disabled{opacity:.4}
.score{display:flex;align-items:center;gap:18px;border:3px solid var(--ink);border-radius:26px;background:#fff;box-shadow:6px 6px 0 var(--ink);padding:20px}
.score .t{font-size:26px;font-weight:800;line-height:1.1}
.score .s{font-size:15px;color:var(--mute);margin-top:6px}
.acts{display:grid;gap:10px;margin:20px 0 24px}
.acts button{height:58px;border-radius:18px;font-size:17px;font-weight:800;border:2.5px solid var(--ink)}
.acts .p{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts .o{background:#fff}
.rows{display:flex;flex-direction:column;gap:10px}
details.row{border:2px solid var(--line);border-radius:18px;background:#fff;padding:14px}
details[open].row{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:13px}
summary{display:flex;align-items:center;gap:10px;list-style:none;font-size:18px}
summary::-webkit-details-marker{display:none}
summary .ps{color:var(--blue);font-weight:700;font-size:15px}
summary .chev{margin-left:auto;flex:none}
details[open] .chev{transform:rotate(180deg)}
.tag{display:inline-flex;align-items:center;gap:4px;border:2px solid;border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;font-weight:800;white-space:nowrap}
.tag.ok{background:#DDF3E9;border-color:#1E7A5A;color:#14573F}
.tag.no{background:#FFE3D6;border-color:#C2410C;color:#8F2E05}
.dt{margin-top:10px;font-size:16px;line-height:1.4}
.dt .ipa{margin-top:0;font-size:16px}
.ro{border-radius:12px;background:#F3F6FD;border:2px solid transparent;padding:8px 10px;margin-top:8px}
.ro.ok{background:#DDF3E9;border-color:#1E7A5A}
.ro.no{background:#FFE3D6;border-color:#C2410C}
.ro small{display:block;font-size:14px;color:var(--mute)}
.ro small b{color:var(--ink)}
.ex{margin-top:12px;font-size:15px;font-style:italic}
.vi{font-size:15px;color:var(--mute);margin-top:2px}
.famw{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);font-size:15px;display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="main"></main>
<footer id="foot">
  <button id="back" aria-label="Câu trước"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button id="next">Tiếp</button>
</footer>
<script>
var ROUND=10,MAX_OLD=4,MIN_CARDS=4,all=[],qs=[],qi=0;
var ARROW='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
var CROSS='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var CHEV='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM17 8.5a5 5 0 010 7"/></svg>';
var LOGO='<svg width="112" height="104" viewBox="0 0 112 104" fill="none" role="img" aria-label="Sổ tay và bút chì"><rect x="10" y="8" width="62" height="82" rx="9" fill="#fff" stroke="#1B2559" stroke-width="4"/><path d="M28 8v82" stroke="#F4A9A9" stroke-width="3"/><path d="M38 28h24M38 42h24M38 56h16" stroke="#B7C3E6" stroke-width="3.5" stroke-linecap="round"/><path d="M10 24H3M10 44H3M10 64H3" stroke="#1B2559" stroke-width="4" stroke-linecap="round"/><g transform="rotate(38 76 62)"><rect x="68" y="26" width="16" height="50" rx="3" fill="#FFD84D" stroke="#1B2559" stroke-width="4"/><path d="M68 76l8 16 8-16z" fill="#fff" stroke="#1B2559" stroke-width="4" stroke-linejoin="round"/><path d="M68 38h16" stroke="#1B2559" stroke-width="4"/></g></svg>';

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cap(s){s=String(s==null?"":s).trim();return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function shuffle(a){var r=a.slice(),k,j,t;for(k=r.length-1;k>0;k--){j=Math.floor(Math.random()*(k+1));t=r[k];r[k]=r[j];r[j]=t}return r}
function speak(w,l){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang=l;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function posTxt(p){return p?"("+p+")":""}
function ipa(c){
  var u=(c.ipa_uk||"").trim(),s=(c.ipa_us||"").trim();
  if(u&&s&&u!==s)return '<div class="ipa"><span>UK</span>'+esc(u)+'</div><div class="ipa"><span>US</span>'+esc(s)+'</div>';
  return '<div class="ipa">'+esc(u||s)+'</div>';
}
function ipaText(c){
  var u=(c.ipa_uk||"").trim(),s=(c.ipa_us||"").trim();
  if(u&&s&&u!==s)return "UK "+u+" • US "+s;
  return u||s;
}
function famHtml(c){
  var f=(c.family||[]).map(function(x){
    if(typeof x==="string")return '<div>'+esc(x)+'</div>';
    return '<div><b>'+esc(cap(x.word))+'</b> ('+esc(x.pos||"")+') <span class="mono">'+esc(x.ipa||"")+'</span>'+(x.vi?': '+esc(cap(x.vi)):"")+'</div>';
  }).join("");
  return f?'<div class="famw">'+f+'</div>':"";
}
// Nhiều nhất MAX_OLD từ cũ (các ngày trước), còn lại lấy từ bộ ngày mới nhất
function pickRound(){
  var latest=all.reduce(function(m,c){return c.date>m?c.date:m},"");
  var recent=all.filter(function(c){return c.date===latest});
  var older=all.filter(function(c){return c.date!==latest});
  var nOld=Math.min(MAX_OLD,older.length);
  var nNew=Math.min(ROUND-nOld,recent.length);
  return shuffle(shuffle(older).slice(0,nOld).concat(shuffle(recent).slice(0,nNew)));
}
// Đáp án nhiễu = nghĩa của các từ khác trong kho (ưu tiên cùng loại từ + cùng nhóm)
function makeQ(c){
  var m=String(c.meaning||"").trim(),cw=String(c.word).toLowerCase();
  var seenT={},seenW={},wr=[];
  seenT[m.toLowerCase()]=1;seenW[cw]=1;
  var others=shuffle(all.filter(function(o){return String(o.word).toLowerCase()!==cw}));
  var tiers=[
    function(o){return o.pos===c.pos&&o.group===c.group},
    function(o){return o.pos===c.pos},
    function(){return true}
  ];
  tiers.forEach(function(f){
    others.forEach(function(o){
      if(wr.length>=3||!f(o))return;
      var t=String(o.meaning||"").trim(),k=t.toLowerCase(),w=String(o.word).toLowerCase();
      if(t&&!seenT[k]&&!seenW[w]){seenT[k]=1;seenW[w]=1;wr.push({t:t,w:o.word,p:o.pos,i:ipaText(o)})}
    });
  });
  var right={t:m,w:c.word,p:c.pos,i:ipaText(c)};
  var opts=shuffle([right].concat(wr));
  return {c:c,opts:opts,ans:opts.indexOf(right),pick:-1};
}
function startRound(list){if(!list.length)return;qs=list;qi=0;showQ()}

function showStart(){
  $("#foot").style.display="none";
  $("#main").className="";
  $("#hdr").innerHTML='<h1>Từ vựng tiếng anh</h1>';
  var ok=all.length>=MIN_CARDS;
  $("#main").innerHTML='<div class="start"><div class="stage">'
  +'<i class="tile a">A</i><i class="tile b">B</i><i class="tile c">C</i><i class="tile d">D</i>'
  +'<div class="sheet big">'+LOGO+'<h2>Làm bài<br>trắc nghiệm</h2></div></div>'
  +(ok?'<button class="cta" id="start">Bắt đầu'+ARROW+'</button>'
      :'<div class="note">Cần ít nhất '+MIN_CARDS+' từ để làm bài (hiện có '+all.length+'). Từ sẽ xuất hiện sau các lần gửi Zalo tiếp theo.</div>')
  +'</div>';
}
function showQ(){
  var q=qs[qi],c=q.c,last=qi===qs.length-1,k,segs="";
  for(k=0;k<qs.length;k++)segs+='<div class="seg'+(k<qi?' d':(k===qi?' c':''))+'"></div>';
  $("#hdr").innerHTML='<div class="qh">Câu '+(qi+1)+' / '+qs.length+'</div><div class="segs">'+segs+'</div>';
  var f=$("#foot");f.style.display="grid";
  $("#back").disabled=qi===0;
  var n=$("#next");n.innerHTML=(last?"Nộp bài":"Tiếp")+ARROW;n.disabled=q.pick<0;
  var m=$("#main");m.className="qm";m.scrollTop=0;
  m.innerHTML='<div class="sheet q"><span class="hole l"></span><span class="hole r"></span>'
  +'<div class="word">'+esc(cap(c.word))+'</div><div class="pos">'+esc(posTxt(c.pos))+'</div>'+ipa(c)
  +'<div class="spk"><button class="sp" data-l="en-GB" data-w="'+esc(c.word)+'">'+SPK+'UK</button><button class="sp" data-l="en-US" data-w="'+esc(c.word)+'">'+SPK+'US</button></div></div>'
  +'<div class="ask">Chọn nghĩa đúng</div><div class="opts">'
  +q.opts.map(function(o,i){
    return '<button class="opt'+(q.pick===i?' sel':'')+'" data-k="'+i+'"><span class="lt">'+"ABCD".charAt(i)+'</span><span>'+esc(cap(o.t))+'</span>'
    +'<svg class="ck" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>';
  }).join("")+'</div>';
}
function showResult(){
  $("#foot").style.display="none";
  $("#main").className="";
  $("#hdr").innerHTML='<h1>Từ vựng tiếng anh</h1>';
  var ok=qs.filter(function(q){return q.pick===q.ans}).length,wrong=qs.length-ok,r=ok/qs.length;
  var msg=r>=.9?"Xuất sắc!":r>=.7?"Tốt lắm!":r>=.5?"Khá, cố thêm chút nữa":"Cần ôn thêm";
  var C=301.6,fill=Math.round(C*r),L="ABCD",opened=false;
  var rows=qs.map(function(q){
    var good=q.pick===q.ans,c=q.c;
    var optsHtml=q.opts.map(function(o,k){
      var cls=k===q.ans?' ok':(k===q.pick?' no':'');
      var tag=k===q.ans?' <b style="color:#14573F">Đúng</b>':(k===q.pick?' <b style="color:#8F2E05">Bạn chọn</b>':'');
      return '<div class="ro'+cls+'"><b>'+L.charAt(k)+'.</b> '+esc(cap(o.t))+tag+'<small>→ <b>'+esc(cap(o.w))+'</b>'+(o.p?' ('+esc(o.p)+')':'')+(o.i?' <span class="mono">'+esc(o.i)+'</span>':'')+'</small></div>';
    }).join("");
    var open=(!good&&!opened)?' open':'';
    if(!good)opened=true;
    return '<details class="row"'+open+'><summary><span class="tag '+(good?'ok':'no')+'">'+(good?CHECK+'Đúng':CROSS+'Sai')+'</span><b>'+esc(cap(c.word))+'</b><span class="ps">'+esc(posTxt(c.pos))+'</span>'+CHEV+'</summary>'
    +'<div class="dt">'+ipa(c)+optsHtml+'<div class="ex">'+esc(c.example)+'</div><div class="vi">'+esc(c.example_vi||"")+'</div>'+famHtml(c)+'</div></details>';
  }).join("");
  $("#main").scrollTop=0;
  $("#main").innerHTML='<div class="score"><svg width="112" height="112" viewBox="0 0 120 120" role="img" aria-label="'+ok+' trên '+qs.length+' câu đúng"><circle cx="60" cy="60" r="48" fill="none" stroke="#DCE5F7" stroke-width="14"/><circle cx="60" cy="60" r="48" fill="none" stroke="#2F4BBF" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+fill+' '+(Math.round(C)-fill)+'" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle" font-size="28" font-weight="800" fill="#1B2559" font-family="Be Vietnam Pro, sans-serif">'+ok+'/'+qs.length+'</text></svg>'
  +'<div><div class="t">'+msg+'</div><div class="s">'+(wrong?'Còn '+wrong+' câu cần ôn':'Đúng tất cả các câu')+'</div></div></div>'
  +'<div class="acts"><button class="p" id="again">Làm lượt mới</button>'+(wrong?'<button class="o" id="retry">Ôn lại '+wrong+' câu sai</button>':'')+'</div>'
  +'<div class="rows">'+rows+'</div>';
}
$("#main").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("opt")){
    qs[qi].pick=+t.dataset.k;
    [].forEach.call(document.querySelectorAll(".opt"),function(o){o.classList.toggle("sel",o===t)});
    $("#next").disabled=false;return;
  }
  if(t.classList.contains("sp")){speak(t.dataset.w,t.dataset.l);return}
  if(t.id==="start"||t.id==="again")startRound(pickRound().map(makeQ));
  else if(t.id==="retry")startRound(qs.filter(function(q){return q.pick!==q.ans}).map(function(q){return makeQ(q.c)}));
});
$("#next").onclick=function(){if(qs[qi].pick<0)return;if(qi<qs.length-1){qi++;showQ()}else showResult()};
$("#back").onclick=function(){if(qi>0){qi--;showQ()}};

// Đọc data/index.json (danh sách tháng) rồi tải song song các file tháng
function getJson(url){return fetch(url+"?t="+Date.now(),{cache:"no-store"})}
getJson("data/index.json").then(function(r){
  if(r.status===404)return {months:[]};
  if(!r.ok)throw new Error("index");
  return r.json();
}).then(function(m){
  return Promise.all((m.months||[]).map(function(mo){
    return getJson("data/"+mo+".json").then(function(r){return r.ok?r.json():[]}).catch(function(){return []});
  }));
}).then(function(parts){
  all=[].concat.apply([],parts);showStart();
}).catch(function(){
  $("#main").innerHTML='<div class="note">Không tải được dữ liệu. Kiểm tra kết nối rồi tải lại trang.</div>';
});
</script>
</body>
</html>
