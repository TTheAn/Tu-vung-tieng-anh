<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="Từ vựng tiếng anh">
<title>Từ vựng tiếng anh</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1c1b19;--muted:#6f6b63;--line:#e4e1d8;--accent:#2f6f5e;--tint:#e3efe9;--on:#fff;--good:#2f6f5e;--bad:#b4532f}
@media(prefers-color-scheme:dark){:root{--bg:#121413;--surface:#1c1f1d;--ink:#eeece6;--muted:#9a978f;--line:#2b2f2c;--accent:#6fc2a8;--tint:#1d2e28;--on:#0d1a15;--good:#6fc2a8;--bad:#e08a62}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
h1{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
main{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.hero{text-align:center;padding:48px 8px;color:var(--muted);line-height:1.6}
.hero .big{font-size:56px}
.hero h2{color:var(--ink);margin:8px 0;font-size:24px}
.hero b{color:var(--ink)}
.qhead{font-size:13px;color:var(--muted);margin-bottom:10px}
.wordbox{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 16px;text-align:center}
.word{font-size:clamp(32px,10vw,46px);font-weight:700;letter-spacing:-.02em;word-break:break-word}
.pos{font-size:15px;color:var(--accent);font-weight:600}
.ipa{font-size:17px;color:var(--muted);margin-top:4px}
.ipa span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-right:4px}
.spk{display:flex;gap:10px;justify-content:center;margin-top:12px}
.sp{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-family:inherit}
.ask{font-size:14px;color:var(--muted);margin:16px 2px 8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px;font-size:17px;font-family:inherit;line-height:1.35}
.opt .lt{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.sel .lt{background:var(--accent);border-color:var(--accent);color:var(--on)}
.foot{display:none;padding-top:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
#bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.row2{display:grid;grid-template-columns:56px 1fr;gap:10px}
.b{border:0;border-radius:18px;padding:16px 10px;font-size:17px;font-weight:700;font-family:inherit}
.b.cta{background:var(--accent);color:var(--on)}
.b.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:20px}
.b:disabled{opacity:.4}
.b:active:not(:disabled){transform:scale(.98)}
.hero .b{width:100%;margin-top:18px}
.score{text-align:center;padding:18px 0 8px}
.score .n{font-size:56px;font-weight:800;letter-spacing:-.03em}
.score .m{color:var(--muted)}
.acts{display:grid;gap:10px;margin:14px 0 18px}
.acts .b.alt{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:8px}
details.row{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
summary{display:flex;align-items:center;gap:10px;list-style:none;font-size:17px}
summary::-webkit-details-marker{display:none}
.st{font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;border:1.5px solid;white-space:nowrap}
.st.ok{color:var(--good);border-color:var(--good)}
.st.no{color:var(--bad);border-color:var(--bad)}
.dt{margin-top:10px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.dt .ex{font-style:italic}
.dt .vi{color:var(--muted)}
.ro{padding:6px 0;border-top:1px solid var(--line)}
.ow{display:block;margin-top:2px;color:var(--muted)}
.ow b{color:var(--ink)}
.famw{margin-top:4px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<h1>Từ vựng tiếng anh</h1>
<main id="main"></main>
<footer class="foot" id="foot">
  <div class="prog"><div id="bar"></div></div>
  <div class="row2">
    <button id="back" class="b ghost" aria-label="Câu trước">←</button>
    <button id="next" class="b cta">Tiếp →</button>
  </div>
</footer>
<script>
var ROUND=10,MAX_OLD=4,MIN_CARDS=4,all=[],qs=[],qi=0;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){var r=a.slice(),k,j,t;for(k=r.length-1;k>0;k--){j=Math.floor(Math.random()*(k+1));t=r[k];r[k]=r[j];r[j]=t}return r}
function speak(w,l){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang=l;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function ipa(c){
  var u=(c.ipa_uk||"").trim(),s=(c.ipa_us||"").trim();
  if(u&&s&&u!==s)return '<div class="ipa"><span>UK</span>'+esc(u)+'</div><div class="ipa"><span>US</span>'+esc(s)+'</div>';
  return '<div class="ipa">'+esc(u||s)+'</div>';
}
function ipaText(c){
  var u=(c.ipa_uk||"").trim(),s=(c.ipa_us||"").trim();
  if(u&&s&&u!==s)return "UK "+u+" • US "+s;
  return u||s;
}
function famHtml(c){
  var f=(c.family||[]).map(function(x){
    if(typeof x==="string")return '<div>👪 '+esc(x)+'</div>';
    return '<div>👪 <b>'+esc(x.word)+'</b> ('+esc(x.pos||"")+') '+esc(x.ipa||"")+(x.vi?': '+esc(x.vi):"")+'</div>';
  }).join("");
  return f?'<div class="famw">'+f+'</div>':"";
}
// Nhiều nhất MAX_OLD từ cũ (các ngày trước), còn lại lấy từ bộ ngày mới nhất
function pickRound(){
  var latest=all.reduce(function(m,c){return c.date>m?c.date:m},"");
  var recent=all.filter(function(c){return c.date===latest});
  var older=all.filter(function(c){return c.date!==latest});
  var nOld=Math.min(MAX_OLD,older.length);
  var nNew=Math.min(ROUND-nOld,recent.length);
  return shuffle(shuffle(older).slice(0,nOld).concat(shuffle(recent).slice(0,nNew)));
}
// Đáp án nhiễu = nghĩa của các từ khác trong kho (ưu tiên cùng loại từ + cùng nhóm)
function makeQ(c){
  var m=String(c.meaning||"").trim(),cw=String(c.word).toLowerCase();
  var seenT={},seenW={},wr=[];
  seenT[m.toLowerCase()]=1;seenW[cw]=1;
  var others=shuffle(all.filter(function(o){return String(o.word).toLowerCase()!==cw}));
  var tiers=[
    function(o){return o.pos===c.pos&&o.group===c.group},
    function(o){return o.pos===c.pos},
    function(){return true}
  ];
  tiers.forEach(function(f){
    others.forEach(function(o){
      if(wr.length>=3||!f(o))return;
      var t=String(o.meaning||"").trim(),k=t.toLowerCase(),w=String(o.word).toLowerCase();
      if(t&&!seenT[k]&&!seenW[w]){seenT[k]=1;seenW[w]=1;wr.push({t:t,w:o.word,p:o.pos,i:ipaText(o)})}
    });
  });
  var right={t:m,w:c.word,p:c.pos,i:ipaText(c)};
  var opts=shuffle([right].concat(wr));
  return {c:c,opts:opts,ans:opts.indexOf(right),pick:-1};
}
function startRound(list){if(!list.length)return;qs=list;qi=0;showQ()}
function showStart(){
  $("#foot").style.display="none";
  var n=all.length,html;
  if(n>=MIN_CARDS){
    html='<p>Kho có <b>'+n+'</b> từ. Mỗi lượt tối đa '+ROUND+' câu, trong đó nhiều nhất '+MAX_OLD+' câu là từ cũ. Đáp án nhiễu là nghĩa của các từ khác trong kho, nên mỗi câu cũng giúp bạn ôn lại từ cũ. Đáp án chỉ hiện sau khi làm xong.</p><button class="b cta" id="start">Bắt đầu</button>';
  }else{
    html='<p>Cần ít nhất '+MIN_CARDS+' từ trong kho để làm bài (hiện có '+n+'). Từ sẽ xuất hiện sau các lần gửi Zalo tiếp theo.</p>';
  }
  $("#main").innerHTML='<div class="hero"><div class="big">🧠</div><h2>Làm bài trắc nghiệm</h2>'+html+'</div>';
}
function showQ(){
  var q=qs[qi],c=q.c,last=qi===qs.length-1;
  $("#foot").style.display="block";
  $("#bar").style.width=((qi+1)/qs.length*100)+"%";
  $("#back").disabled=qi===0;
  var n=$("#next");n.textContent=last?"Nộp bài":"Tiếp →";n.disabled=q.pick<0;
  $("#main").scrollTop=0;
  $("#main").innerHTML='<div class="qhead">Câu '+(qi+1)+' / '+qs.length+'</div>'
  +'<div class="wordbox"><div class="word">'+esc(c.word)+'</div><div class="pos">'+esc(c.pos?"("+c.pos+")":"")+'</div>'+ipa(c)
  +'<div class="spk"><button class="sp" data-l="en-US" data-w="'+esc(c.word)+'">🔊 US</button><button class="sp" data-l="en-GB" data-w="'+esc(c.word)+'">🔊 UK</button></div></div>'
  +'<div class="ask">Chọn nghĩa đúng:</div><div class="opts">'
  +q.opts.map(function(o,k){return '<button class="opt'+(q.pick===k?' sel':'')+'" data-k="'+k+'"><span class="lt">'+"ABCD".charAt(k)+'</span><span>'+esc(o.t)+'</span></button>'}).join("")+'</div>';
}
function showResult(){
  $("#foot").style.display="none";
  var ok=qs.filter(function(q){return q.pick===q.ans}).length,r=ok/qs.length;
  var msg=r>=.9?"Xuất sắc!":r>=.7?"Tốt lắm!":r>=.5?"Khá, cố thêm chút nữa":"Cần ôn thêm";
  var L="ABCD";
  var rows=qs.map(function(q){
    var good=q.pick===q.ans,c=q.c;
    var optsHtml=q.opts.map(function(o,k){
      var tag=k===q.ans?' <span class="st ok">✓ Đúng</span>':(k===q.pick?' <span class="st no">✗ Bạn chọn</span>':'');
      return '<div class="ro">'+L.charAt(k)+'. '+esc(o.t)+tag+'<span class="ow">→ <b>'+esc(o.w)+'</b>'+(o.p?' ('+esc(o.p)+')':'')+(o.i?' '+esc(o.i):'')+'</span></div>';
    }).join("");
    return '<details class="row"><summary><span class="st '+(good?'ok':'no')+'">'+(good?'✓ Đúng':'✗ Sai')+'</span><b>'+esc(c.word)+'</b><span class="pos">'+esc(c.pos?"("+c.pos+")":"")+'</span></summary><div class="dt">'
    +ipa(c)+optsHtml
    +'<div class="ex">'+esc(c.example)+'</div><div class="vi">'+esc(c.example_vi||"")+'</div>'+famHtml(c)+'</div></details>';
  }).join("");
  $("#main").scrollTop=0;
  $("#main").innerHTML='<div class="score"><div class="n">'+ok+'/'+qs.length+'</div><div class="m">'+msg+'</div></div>'
  +'<div class="acts"><button class="b cta" id="again">Làm lượt mới</button>'
  +(ok<qs.length?'<button class="b alt" id="retry">Ôn lại '+(qs.length-ok)+' câu sai</button>':'')+'</div>'
  +'<div class="rows">'+rows+'</div>';
}
$("#main").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("opt")){
    qs[qi].pick=+t.dataset.k;
    [].forEach.call(document.querySelectorAll(".opt"),function(o){o.classList.toggle("sel",o===t)});
    $("#next").disabled=false;return;
  }
  if(t.classList.contains("sp")){speak(t.dataset.w,t.dataset.l);return}
  if(t.id==="start"||t.id==="again")startRound(pickRound().map(makeQ));
  else if(t.id==="retry")startRound(qs.filter(function(q){return q.pick!==q.ans}).map(function(q){return makeQ(q.c)}));
});
$("#next").onclick=function(){if(qs[qi].pick<0)return;if(qi<qs.length-1){qi++;showQ()}else showResult()};
$("#back").onclick=function(){if(qi>0){qi--;showQ()}};

// Đọc data/index.json (danh sách tháng) rồi tải song song các file tháng
function getJson(url){return fetch(url+"?t="+Date.now(),{cache:"no-store"})}
getJson("data/index.json").then(function(r){
  if(r.status===404)return {months:[]};
  if(!r.ok)throw new Error("index");
  return r.json();
}).then(function(m){
  return Promise.all((m.months||[]).map(function(mo){
    return getJson("data/"+mo+".json").then(function(r){return r.ok?r.json():[]}).catch(function(){return []});
  }));
}).then(function(parts){
  all=[].concat.apply([],parts);showStart();
}).catch(function(){
  $("#main").innerHTML='<div class="hero"><p>Không tải được dữ liệu. Kiểm tra kết nối rồi tải lại trang.</p></div>';
});
</script>
</body>
</html>
